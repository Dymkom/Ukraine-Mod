# NATION
Hetmanate = Гетьманщина
Bohdan Khmelnytsky = Богдан Хмельницький
Hail, brave Bohdan Khmelnytsky, Hetman of the Zaporizhian Host. A Ukrainian, you were born in the Polish-Lithuanian Commonwealth, and after being captured by the Ottoman Empire, you were loyal to the Commonwealth, being a registered Cossack. However, after the weak king refused to intervene after your property and wife were lost to a powerful magnate in the Czapliński Affair, you did not give up. You fought for your rights and, seeking help with your Cossack allies after your Polish ones refused to act, you went to war with the Commonwealth, for the good of all Cossacks. Seeking foreign help, you allied with the Tatars, who proved to be unreliable, and thus, you made one of the most consequential decisions of your lifetime, to side with Moscow. The alliance was uneasy, and often you struggled with the relationship, however, it left your people with far much autonomy. = Слава тобі, відважний Богдане Хмельницький, гетьмане Війська Запорозького! Ти народився українцем у Речі Посполитій, побував в османському полоні, а згодом, як реєстровий козак, залишався вірним підданим Речі Посполитої. Та коли слабкий король відмовився втрутитися після того, як могутній магнат Чаплинський позбавив тебе майна й дружини, ти не скорився. Ти став на захист своїх прав і, не дочекавшись допомоги від польських союзників, звернувся до побратимів-козаків та розпочав війну з Річчю Посполитою заради волі всіх козаків. В пошуку зовнішньої підтримки, ти уклав союз із татарами, які виявилися ненадійними. Тож ти ухвалив одне з найважливіших рішень у своєму житті — укласти союз із Москвою. Цей союз був непростим і сповненим суперечностей, а його відлуння визначатиме долю твого народу ще багато поколінь.
Hetman Khmelnytsky, once again your people are under attack from an outside power who seeks to exploit your people. Take up arms in the face of overwhelming odds once again, face down former allies who would see harm upon your people. Can you secure the territorial independence of your state? Will you build a civilization that can stand the test of time? = Гетьмане Хмельницький, знову твій народ опинився під загрозою чужоземної сили, що прагне поневолити його. Знову візьми до рук зброю перед ворогом, який переважає і стань проти колишніх союзників, які бажають лиха твоєму народові. Чи зможеш ти відстояти незалежність своєї держави? Чи збудуєш цивілізацію, що витримає випробування віками?

And all people will help me in war, for you have no justification and I am backed by God. = І весь народ стане зі мною до бою, бо за тобою немає правди, а за мною — Божа воля.
That is a mistake. Before, I was fighting for the insults and injustice caused to me, now I will fight for my people's faith. = Це була помилка. Раніше я боровся за власну кривду й несправедливість, тепер же боротимуся за віру свого народу.
I already did more than was thought possible before. While I lay down my weapon, I have sparked a creed in my people. = Я вже звершив більше, ніж будь-хто вважав можливим. Складаючи зброю, я залишаю своєму народові ідею, що житиме далі.
Let the host welcome you. I am Bohdan Khmelnytsky, Hetman of the Cossacks. = Ласкаво просимо до Війська Запорозького. Я — Богдан Хмельницький, гетьман козаків.

You make a good friend to the Zaporozhian Host. = Ти є добрим другом Війська Запорозького.
You are not worthy of comparing to even vermin. Be gone with you. = Ти не вартий навіть порівняння з паразитом. Геть з моїх очей.

The Zaporozhian Host offers you fair exchange. Let us strengthen our ties through trade. = Військо Запорозьке пропонує чесний обмін. Нехай торгівля зміцнить наші взаємини.

Free Men of the Wild Fields = Вільні люди Дикого Поля

